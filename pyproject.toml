[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joseph-api"
version = "0.1.0"
description = "Shared data model and API for the joseph-* family: instruments, market and account DTOs, revision records."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12.5"]
license = { text = "Proprietary - license to be decided by the owner" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joseph_api = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
files = ["src/joseph_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
